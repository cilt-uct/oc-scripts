id: nibity-attach-transcripts
title: Attach caption/transcripts generated by Nibity
tags: []
description: |-
  Attach transcription generated by the Nibity service.
      This is an internal workflow, started by the Transcription Service.
operations:
  # Apply the default workflow configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - googleTranscript: true
      - uploadedTranscript: true
      - has-vtt: true
      - download-source-flavors: text/*,captions/*
  # Check if event has been retracted
  - id: execute-once
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Check if event has been retracted
    configurations:
      - exec: /opt/opencast/wfexec/check-if-retracted.pl
      - load: '0.1'
      - params: '#{id} #{out}'
      - output-filename: retracted_event.txt
      - target-flavor: text/plain
      - set-workflow-properties: true
      - expected-type: Attachment
  # Untag Google Speech captions
  - id: tag
    description: Untag Google Speech captions
    configurations:
      - source-flavors: captions/*
      - source-tags: engage-download,generator:google-speech,lang:en
      - target-tags: -engage-download
  # Remove published transcripts
  - id: include
    exception-handler-workflow: partial-error
    description: Retract published transcripts from event
    configurations:
      - workflow-id: uct-remove-transcripts
  # Archive the current state of the mediapackage
  - id: snapshot
    description: Archive the current state
    configurations:
      - source-flavors: '*/*'
  # Attach caption/transcript
  - id: nibity-attach-transcription
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Attach captions/transcription
    configurations:
      # This is filled out by the transcription service when starting this workflow
      - transcription-job-id: ${transcriptionJobId}
      # Captions generated will have the default flavor based on the target-caption-format and language e.g. captions/vtt+en
      # From 15x - Change captions flavor to "captions/source"
      - target-flavor: captions/source
      - target-caption-format: vtt
      - target-tag: engage-download
      - target-element-type: track
  # Tag captions with laguage code
  - id: tag
    description: Tagging captions with language code
    configurations:
      - source-flavors: captions/source
      - target-tags: +lang:en,+generator:waywithwords,+generator-type:auto
  # Merge caption/transcript to existing publication and republish
  - id: publish-engage
    fail-on-error: true
    if: NOT(${retracted_event})
    exception-handler-workflow: partial-error
    description: Distribute and publish to engage server
    configurations:
      - download-source-flavors: dublincore/*,security/*
      - download-source-tags: engage-download
      - strategy: merge
      - check-availability: true
  - id: execute-once
    max-attempts: 3
    retry-strategy: retry
    fail-on-error: false
    if: NOT(${retracted_event})
    exception-handler-workflow: partial-error
    description: Notify Middleware of Lecture Summaries
    configurations:
      - exec: /opt/opencast/wfexec/post-notification.pl
      - load: '0.1'
      - params: '#{id} oc-publish-captions'
  - id: republish-oaipmh
    if: NOT(${retracted_event})
    exception-handler-workflow: partial-error
    description: Update recording metadata in default OAI-PMH repository
    configurations:
      - source-flavors: dublincore/*,security/*
      - download-source-tags: engage-download
      - repository: default
  # Archive media package
  - id: snapshot
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Archive media package
    configurations:
      - source-flavors: '*/*'
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Remove temporary processing artifacts
    configurations:
      - delete-external: true
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: security/*
