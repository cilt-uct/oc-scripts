id: uct-partial-ingest
title: UCT - Ingest asset
tags: []
operations:
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Finalize ingest

  # Ingest the external elements, apply access control entries,
  # inspect the media and tag everything for archival.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Inspect the media
  - id: inspect
    exception-handler-workflow: partial-error
    description: Inspecting audio and video streams
    configurations:
      - overwrite: true
      - accept-no-media: false
      - accurate-frame-count: false
  # Apply access control lists from series to the mediapackage.
  #       Only runs if Event is linked to Series, SKIPPED if not.
  - id: series
    exception-handler-workflow: partial-error
    description: Applying access control entries
    configurations:
      - attach: '*'
      - apply-acl: true
  # Run track4k on presenter-4k/source to presenter/source
  - id: execute-many
    fail-on-error: true
    retry-strategy: hold
    exception-handler-workflow: partial-error
    description: Track4K
    configurations:
      - exec: /opt/opencast/wfexec/track4k.pl
      - params: '#{in} #{out} ${event_location}'
      - source-flavor: presenter4k/source
      - source-video: true
      - output-filename: tracked.mkv
      - target-flavor: presenter/source
      - target-tags: archive
      - expected-type: Track
      - load: '2.0'
  # Analyze Tracks: set flavor_source workflow properties
  - id: analyze-tracks
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: 'Analyze: SOURCE'
    configurations:
      - source-flavor: '*/source'
      - aspect-ratio: 4/3,16/9
  # Tag the sources for archival
  - id: tag
    description: Tagging source material for archival
    configurations:
      - source-flavors: '*/*'
      - target-tags: +archive
  # Untag track4k
  - id: tag
    description: Exclude 4K presenter source from archive
    configurations:
      - source-flavors: presenter4k/source
      - target-tags: -archive
  # Tag any optionally uploaded assets
  - id: tag
    if: ${downloadSourceflavorsExist}
    exception-handler-workflow: partial-error
    description: Tagging uploaded assets for distribution
    configurations:
      - source-flavors: ${download-source-flavors}
      - target-tags: +engage-download
  # make sure to save ACL and dublincore
  - id: tag
    exception-handler-workflow: partial-error
    description: Add archive tags for dublincore/*,security/*
    configurations:
      - source-flavors: dublincore/*,security/*
      - target-tags: archive
  # Tag the incoming metadata catalogs for publishing
  - id: tag
    description: Tagging metadata catalogs for publication
    configurations:
      - source-flavors: dublincore/*
      - target-tags: +engage-download
  # Tagging captions for publication
  - id: tag
    description: Tagging captions for publication
    configurations:
      - source-flavors: '*/captions'
      - target-tags: +engage-download
  - id: snapshot
    description: Archive after ingest
    configurations:
      - source-tags: archive
