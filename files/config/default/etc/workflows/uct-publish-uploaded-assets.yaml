id: publish-uploaded-assets
title: Publish uploaded assets
tags: []
description: |-
  Publish uploaded assets
state-mappings:
  - state: running
    value: EVENTS.EVENTS.STATE_MAPPING.PUBLISHING
  - state: failing
    value: EVENTS.EVENTS.STATE_MAPPING.PUBLISHING
operations:
  # Apply the default workflow configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - publishToEngage: true
  # Tagging captions for publication
  - id: tag
    description: Tagging captions for publication
    configurations:
      - source-flavors: ${download-source-flavors}
      - target-tags: engage-download,archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to publication channels

  # Update the recording metadata in the publication channels.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to engage player
  - id: publish-engage
    if: ${publishToEngage}
    exception-handler-workflow: partial-error
    description: Update recording in Opencast Media Module
    configurations:
      - download-source-flavors: dublincore/*,security/*,text/*,captions/*
      - download-source-tags: engage-download
      - strategy: merge
      - check-availability: false
  # Publish to engage player
  - id: republish-oaipmh
    if: ${publishToOaiPmh}
    exception-handler-workflow: partial-error
    description: Update recording metadata in default OAI-PMH repository
    configurations:
      - source-flavors: ${download-source-flavors}
      - repository: default
  # Archive the current state of the mediapackage
  - id: snapshot
    description: Archiving new assets
    configurations:
      - source-flavors: '*/*'
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
