id: uct-process-obs
title: UCT - Process OBS Recording
tags:
  - schedule
  - upload
  - archive
operations:
  - id: defaults
    description: Applying default configuration values
    configurations:
      - presenter_work_video: false
      - presentation_work_video: false
      - presentation2_work_video: false
      - presenter_source_resolution_y: 1080
      - thumbnailType: 0
      - thumbnailPosition: 1
      - doPictureInPicture: true
      - result_publish_process: work
      - flipVideoHoriz: false
  - id: defaults
    if: ${flipVideoHoriz}
    description: Flip video image horizontally
    configurations:
      - workProfileFlip: hflip
  # Check whether this series has a my videos - else create one
  - id: execute-once
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Create My Videos
    configurations:
      - exec: /opt/opencast/wfexec/create-my-videos.pl
      - load: '0.1'
      - params: '#{id} #{out}'
      - output-filename: my_videos.txt
      - set-workflow-properties: true
      - expected-type: Attachment
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Inspect, analyze tracks (*/*), apply series access control
  #       archive */source, and tag metadata for archive and publish.
  # Inspect the media
  - id: inspect
    exception-handler-workflow: partial-error
    description: Inspecting source media
    configurations:
      - overwrite: true
      - accept-no-media: false
      - accurate-frame-count: true
  # Apply access control lists from series to the mediapackage.
  #       Only runs if Event is linked to Series, SKIPPED if not.
  - id: series
    exception-handler-workflow: partial-error
    description: Applying access control entries
    configurations:
      - attach: '*'
      - apply-acl: true
  # Analyze Tracks: set flavor_source workflow properties
  - id: analyze-tracks
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: 'Analyze: SOURCE'
    configurations:
      - source-flavor: '*/source'
      - aspect-ratio: 4/3,16/9
  # Save workflow properties
  - id: export-wf-properties
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Export workflow settings to Java properties file
    configurations:
      - target-flavor: processing/defaults
      - target-tags: archive
  # Tag the sources for archival
  - id: tag
    description: Tagging source material for archival
    configurations:
      - source-flavors: '*/*'
      - target-tags: +archive
  # Tag the incoming metadata catalogs for publishing
  - id: tag
    description: Tagging metadata catalogs for publication
    configurations:
      - source-flavors: dublincore/*
      - target-tags: +engage-download
  # Archive generated items
  - id: snapshot
    description: Archive source
    configurations:
      - source-tags: archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Prepare work versions of the source material for archive and processing.
  #       Preview and Publish use Work versions. (*/work)

  #       Different from normal work process because we USE RIGHT CHANNEL
  - id: include
    description: Prepare work version for processing
    configurations:
      - workflow-id: uct-partial-work
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Process video in parallel for publishing - without normalizing audio
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encode for publication to Engage

  # Encode audio and video formats to the distribution formats that
  # are required by the Engage publication channel.
  # Also encode them for publication to rss and atom feeds.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encoding presenter for Engage player and feeds

  #       Video: MP4 container, H264 codec. [1080p 720p, 480p or other
  #       Audio: 44100Hz 128k, NOT NORMALIZED
  # A
  - id: encode
    if: (${presenter_source_resolution_y} > 1079)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [1080p, 720p, 480p]: mp4-480-720-1080-parallel'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-480-720-1080-parallel.http
  # B
  - id: encode
    if: (${presenter_source_resolution_y} < 1080) AND
      (${presenter_source_resolution_y} > 719)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [720p, 480p]: mp4-480-720-parallel'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-480-720-parallel.http
  # C
  - id: encode
    if: (${presenter_source_resolution_y} < 720) AND
      (${presenter_source_resolution_y} > 479)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [480p]: mp4-480'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-480.http
  # D
  - id: encode
    if: (${presenter_source_resolution_y} < 480)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [other]: mp4-other'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-other.http
  # Audio: MP3 container, 44.1khz 128Kbps
  - id: encode
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Encoding audio for Engage player (MP3)
    configurations:
      - source-flavor: presenter/work
      - target-flavor: presenter/delivery
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp3.http
      - process-first-match-only: true
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Create a picture-in-picture variant of

  #        In: */${result_publish_process} default: normalized-themed
  #       Out: pic-in-pic/delivery
  - id: include
    if: ${doPictureInPicture}
    description: Include encode picture-in-picture
    configurations:
      - workflow-id: uct-include-picture-in-picture
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Create Composite download versions of presenter, presentation and
  #       presentation2 in either 2 panel or 3 panel variant.

  #        In: */${result_publish_process} default: normalized-trimmed
  #       Out: composite/delivery
  - id: include
    description: Include publishing for downloads
    configurations:
      - workflow-id: uct-partial-publish-downloads
  # Image - Search
  - id: image
    exception-handler-workflow: partial-error
    description: Creating search result thumbnails
    configurations:
      - source-flavor: '*/delivery'
      - source-tags: ''
      - target-flavor: '*/search+preview'
      - target-tags: engage-download
      - encoding-profile: search-cover.http
      - time: 5
  # Image - Player preview
  - id: image
    exception-handler-workflow: partial-error
    description: Creating player preview image
    configurations:
      - source-flavor: '*/delivery'
      - source-tags: ''
      - target-flavor: '*/player+preview'
      - target-tags: engage-download
      - encoding-profile: player-preview.http
      - time: 5
  # NOTE: feed previews generation no longer supported from OC16+
  # Encode to feed cover images
  # - id: image
  #   exception-handler-workflow: partial-error
  #   description: Creating feed cover image
  #   configurations:
  #     - source-flavor: '*/delivery'
  #     - source-tags: ''
  #     - target-flavor: '*/feed+preview'
  #     - target-tags: atom,rss
  #     - encoding-profile: feed-cover.http
  #     - time: 5
  - id: tag
    description: Removing unneeded presenter-cover from download publication
    configurations:
      - source-flavors: presenter/player+preview
      - target-tags: -engage-download
  - id: image
    exception-handler-workflow: partial-error
    description: Creating player preview image
    configurations:
      - source-flavor: presenter/delivery
      - source-tags: ''
      - target-flavor: presenter/coverbackground
      - encoding-profile: player-preview.http
      - time: 1
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to publication channels

  # Send the encoded material along with the metadata to the
  # publication channels.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: publish-engage
    max-attempts: 2
    exception-handler-workflow: partial-error
    description: Publishing to Opencast Media Module
    configurations:
      - download-source-flavors: dublincore/*,security/*
      - download-source-tags: engage-download,atom,rss,mobile
      - streaming-source-tags: engage-streaming
      - check-availability: true
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: snapshot
    description: Archive publishing information
    configurations:
      - source-tags: archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Do the work to prepare for editing. (*/preview)
  - id: include
    if: ${presenter_raw_video} OR ${presenter_source_audio} OR
      ${presentation_source_video} OR ${presentation2_source_video}
    description: Prepare preview versions for Editing
    configurations:
      - workflow-id: uct-partial-preview
  # Save workflow properties
  - id: export-wf-properties
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Export workflow settings to Java properties file
    configurations:
      - target-flavor: processing/defaults
      - target-tags: archive
  # Archive generated items
  - id: snapshot
    description: Archive work and preview information
    configurations:
      - source-tags: archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Send an e-mail indicating that the process has finished
  # [OPENCAST-2249]
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # operation
  #       id="send-email"
  #     </operation
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
