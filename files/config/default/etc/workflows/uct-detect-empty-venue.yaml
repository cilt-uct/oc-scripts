id: uct-detect-empty-venue
title: UCT - Empty venue detection
tags:
  - archive
description: |-
  Run VAD script, to analyse speech segments and in turn identify if venue is empty.
operations:
  # Inspect the media
  - id: inspect
    exception-handler-workflow: partial-error
    description: Inspecting mediapackage track elements
    configurations:
      - overwrite: true
      - accept-no-media: false
      - accurate-frame-count: false

  - id: execute-once
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Run empty venue detection script (Whisper)
    configurations:
      - exec: /opt/opencast/wfexec/wrapper-detect-empty-venue.sh
      - load: 0.1
      - params: '#{flavor(captions/json)} #{id} #{out}'
      - output-filename: segments.txt
      - set-workflow-properties: true
      - expected-type: Attachment