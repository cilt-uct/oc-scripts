id: uct-detect-empty-venue
title: UCT - Empty venue detection
tags:
  - archive
description: |-
  Run VAD script, to analyse speech segments and in turn identify if venue is empty.
operations:
  # Inspect the media
  - id: inspect
    exception-handler-workflow: partial-error
    description: Inspecting mediapackage track elements
    configurations:
      - overwrite: true
      - accept-no-media: false
      - accurate-frame-count: false
