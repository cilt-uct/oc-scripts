id: uct-clean-track4k
title: Clean up Track4k Files
tags:
  - archive
operations:
  - id: asset-delete
    fail-on-error: true
    exception-handler-workflow: error
    description: Delete from AssetManager
    configurations:
      - keep-last-snapshot: true
  # Comment that we cleaned up this recording
  - id: comment
    fail-on-error: false
    description: Comment that we cleaned up Track4k files (create)
    configurations:
      - description: Clean up Track4k Files.
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.OTHER
      - action: create
  - id: comment
    fail-on-error: false
    description: Comment that we cleaned up Track4k files (resolve)
    configurations:
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.OTHER
      - action: resolve
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
