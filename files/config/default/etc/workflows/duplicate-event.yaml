id: duplicate-event
title: Duplicate Event
tags:
  - archive
displayOrder: 10
state-mappings:
  - state: running
    value: EVENTS.EVENTS.STATE_MAPPING.DUPLICATING
  - state: failing
    value: EVENTS.EVENTS.STATE_MAPPING.DUPLICATING
configuration_panel_json: |2-

          [
          {
              "description": "Title of Duplicate:",
              "fieldset": [
              {
                  "name": "mpTitle",
                  "type": "text",
                  "value": " "
              }
              ]
          },
          {
              "description": "Series Id:",
              "fieldset": [
                  {
                  "name": "seriesId",
                  "type": "text",
                  "value": " "
              }
              ]
          },
          {
              "description": "Insert the number of duplicated events",
              "fieldset": [
              {
                  "name": "numberOfEvents",
                  "type": "number",
                  "label": "Number of Events",
                  "min": "1",
                  "max": "25",
                  "value": "1"
              }
              ]
          },
          {
              "fieldset": [
              {
                  "name": "noCopySuffix",
                  "type": "checkbox",
                  "label": "Do not use copy suffix",
                  "value": false
              }
              ]
          }
          ]

operations:

  # Apply the default workflow configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - usePresenter: true
      - usePresentation: true
      - usePresentation2: true

  # None : 0|0|0
  - id: defaults
    if: NOT(${usePresenter}) AND NOT(${usePresentation}) AND
      NOT(${usePresentation2})
    description: Use everything
    configurations:
      - copy_flavor: none/none

  # 0|0|1
  - id: defaults
    if: NOT(${usePresenter}) AND NOT(${usePresentation}) AND ${usePresentation2}
    description: Use everything
    configurations:
      - copy_flavor: presentation2/source

  # 0|1|0
  - id: defaults
    if: NOT(${usePresenter}) AND ${usePresentation} AND NOT(${usePresentation2})
    description: Use everything
    configurations:
      - copy_flavor: presentation/source

  # 0|1|1
  - id: defaults
    if: NOT(${usePresenter}) AND ${usePresentation} AND ${usePresentation2}
    description: Use everything
    configurations:
      - copy_flavor: presentation/source,presentation2/source

  # 1|0|0
  - id: defaults
    if: ${usePresenter} AND NOT(${usePresentation}) AND NOT(${usePresentation2})
    description: Use everything
    configurations:
      - copy_flavor: presenter/source

  # 1|0|1
  - id: defaults
    if: ${usePresenter} AND NOT(${usePresentation}) AND ${usePresentation2}
    description: Use everything
    configurations:
      - copy_flavor: presenter/source,presentation2/source

  # 1|1|0
  - id: defaults
    if: ${usePresenter} AND ${usePresentation} AND NOT(${usePresentation2})
    description: Use everything
    configurations:
      - copy_flavor: presenter/source,presentation/source

  # ALL : 1|1|1
  - id: defaults
    if: ${usePresenter} AND ${usePresentation} AND ${usePresentation2}
    description: Use everything
    configurations:
      - copy_flavor: '*/*'

  # Create the new events
  - id: duplicate-event
    exception-handler-workflow: partial-error
    description: Duplicate Event
    configurations:
      - source-flavors: ${copy_flavor}
      - number-of-events: ${numberOfEvents}
      - set-series-id: ${seriesId}
      - set-title: ${mpTitle}
      - set-start-date-time: ${startDateTime}
      - target-tags: ''
      - property-namespaces:
          org.opencastproject.assetmanager.security,org.opencastproject.workflow.configuration
      - no-suffix: ${noCopySuffix}
      - copy-number-prefix: copy

  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temporary processing artifacts
    configurations:
      # On systems with shared workspace or working file repository
      # you want to set this option to false.
      - delete-external: true
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      # ACLs are required again when working through ActiveMQ messages
      - preserve-flavors: dublincore/*,security/*
