id: uct-process-upload
title: UCT - Process Upload
tags:
  - upload
operations:
  # Apply the default workflow configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - hasSlides: false
      - isUpload: true
      - hasPresentation: false
      - doCaptioning: true
      - downloadSourceflavorsExist: false
  # Load workflow properties from metadata: update some workflow properties
  - id: execute-once
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Load workflow properties from settings in series
    configurations:
      - exec: /opt/opencast/wfexec/wrapper-load-from-metadata.sh
      - load: 0.1
      - params: '#{id} #{out}'
      - output-filename: metadata_workflow.txt
      - set-workflow-properties: true
      - expected-type: Attachment
  # Apply access control lists from series to the mediapackage.
  #       Only runs if Event is linked to Series, SKIPPED if not.
  - id: series
    exception-handler-workflow: partial-error
    description: Applying access control entries
    configurations:
      - attach: '*'
      - apply-acl: true
  # make sure to save ACL and dublincore
  - id: tag
    exception-handler-workflow: partial-error
    description: Add archive tags for dublincore/*,security/*
    configurations:
      - source-flavors: dublincore/*,security/*
      - target-tags: archive
  # Tag the incoming metadata catalogs and captions for publishing
  - id: tag
    description: Tagging metadata catalogs and captions for publication
    configurations:
      - source-flavors: dublincore/*,*/captions
      - target-tags: +engage-download
  # Check if uploaded file is an audio-only file
  - id: execute-many
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Check if uploaded file is an audio file
    configurations:
      - exec: /opt/opencast/wfexec/check-if-file-is-audio-only.sh
      - params: '-i #{in} -o #{out}'
      - source-flavor: track_presenter.0/*
      - output-filename: audio_only.txt
      - target-flavor: text/plain
      - set-workflow-properties: true
      - expected-type: Attachment
      - load: '0.1'
  # Move track_presenter.0/* to presenter/source (LTI uploads)
  - id: encode
    if: NOT(${is_audio_upload})
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Move track_presenter.0/* to presenter/source
    configurations:
      - source-flavor: track_presenter.0/*
      - target-flavor: presenter/source
      - target-tags: archive
      - encoding-profile: uct-copy.work
  # Move track_presentation.0/* to presentation/source (LTI uploads)
  - id: encode
    if: ${hasPresentation} AND NOT(${is_audio_upload})
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Move track_presentation.0/* to presentation/source
    configurations:
      - source-flavor: track_presentation.0/*
      - target-flavor: presentation/source
      - target-tags: archive
      - encoding-profile: uct-copy.work
  # If upload is audio only, create video file with static image
  - id: execute-many
    if: ${is_audio_upload}
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: If upload is audio only, create video file with static image
    configurations:
      - exec: /opt/opencast/wfexec/convert-audio-to-video.sh
      - params: '-i #{in} -o #{out}'
      - source-flavor: track_presenter.0/*
      - output-filename: static.mkv
      - target-flavor: presenter/source
      - target-tags: archive
      - expected-type: Track
      - load: '2.0'
  # Tag the sources for archival
  - id: tag
    description: Tagging source material for archival
    configurations:
      - source-flavors: '*/*'
      - target-tags: +archive
  # Tag the sources for archival
  - id: tag
    description: Remove track_presenter.0/* from archiving
    configurations:
      - source-flavors: track_presenter.0/*
      - target-tags: -archive, -engage-download
  # Tag the presentation source for archival
  - id: tag
    if: ${hasPresentation}
    description: Remove track_presentation.0/* from archiving
    configurations:
      - source-flavors: track_presentation.0/*
      - target-tags: -archive, -engage-download
  # Analyze Tracks: set flavor_source workflow properties
  - id: analyze-tracks
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: 'Analyze: SOURCE'
    configurations:
      - source-flavor: '*/source'
      - aspect-ratio: 4/3,16/9
  # Save workflow properties
  - id: export-wf-properties
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Export workflow settings to Java properties file
    configurations:
      - target-flavor: processing/defaults
      - target-tags: archive
  # Archive generated items
  - id: snapshot
    description: Archive source
    configurations:
      - source-tags: archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Process video in parallel for publishing
  # Encoding presenter, presentation and presentation2 for Engage player and feeds

  #       Video: MP4 container, H264 codec. [1080p 720p, 480p or other
  #       Audio: 44100Hz 128k, normalized to -25db
  # A
  - id: encode
    if: (${presenter_source_resolution_y} > 1079)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [1080p, 720p, 480p]: mp4-norm-480-720-1080-parallel'
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-norm-480-720-1080-parallel.http
  # B
  - id: encode
    if: (${presenter_source_resolution_y} < 1080) AND
      (${presenter_source_resolution_y} > 719)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [720p, 480p]: mp4-norm-480-720-parallel'
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-norm-480-720-parallel.http
  # C
  - id: encode
    if: (${presenter_source_resolution_y} < 720) AND
      (${presenter_source_resolution_y} > 479)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [480p]: mp4-norm-480'
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-norm-480.http
  # D
  - id: encode
    if: (${presenter_source_resolution_y} < 480)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [other]: mp4-norm-other'
    configurations:
      - source-flavor: '*/source'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-norm-other.http
  # Generate timeline preview images
  - id: timelinepreviews
    if: ${presenter_source_video}
    fail-on-error: false
    exception-handler-workflow: error
    description: Creating timeline preview images of the presenter track
    configurations:
      - source-flavor: presenter/delivery
      - target-flavor: presenter/timeline+preview
      - target-tags: engage-download
      - image-count: 100
  # Encoding audio for Engage player and feeds

  #       Audio: MP4 container, 44.1khz 128Kbps

  #       Note: We are not using themes yet
  #             <configuration key="source-flavor">*/normalized-trimmed</configuration>
  - id: encode
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Encoding audio for Engage player (MP3)
    configurations:
      - source-flavor: '*/source'
      - target-flavor: presenter/delivery
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp3.http
      - process-first-match-only: true
  - id: image
    exception-handler-workflow: partial-error
    description: Creating player preview image
    configurations:
      - source-flavor: presenter/delivery
      - source-tags: ''
      - target-flavor: presenter/coverbackground
      - encoding-profile: player-preview.http
      - time: 1
  - id: image
    exception-handler-workflow: partial-error
    description: Creating cover image
    configurations:
      - source-flavor: presenter/delivery
      - target-tags: engage-download
      - target-flavor: presenter/player+preview
      - encoding-profile: player-preview.http
      - time: 1
  - id: image
    exception-handler-workflow: partial-error
    description: Creating cover image for presentation
    configurations:
      - source-flavor: presentation/delivery
      - target-tags: engage-download
      - target-flavor: presentation/player+preview
      - encoding-profile: player-preview.http
      - time: 1
  - id: segment-video
    if: ${hasSlides}
    fail-on-error: false
    description: Fallback to detect slide transitions in presenter track
    configurations:
      - source-flavor: presenter/delivery
      - target-tags: engage-download
  # Generate segment preview images
  - id: segmentpreviews
    fail-on-error: false
    if: ${hasSlides}
    description: Creating preview images for presentation segments
    configurations:
      - source-flavor: presenter/delivery
      - target-flavor: presentation/segment+preview
      - reference-flavor: presenter/delivery
      - reference-tags: engage-download
      - target-tags: engage-download
      - encoding-profile: player-slides.http
  - id: extract-text
    fail-on-error: false
    if: ${hasSlides}
    description: Extracting text from presentation track
    configurations:
      - source-flavor: presenter/delivery
      - target-tags: engage-download,archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Transcription / Caption Services
  # Source: ${transcription_src_flavor} - delivery
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: include
    if: ${doCaptioning}
    description: Include Captioning
    configurations:
      - workflow-id: uct-include-captioning
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to publication channels

  # Send the encoded material along with the metadata to the
  # publication channels.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: publish-engage
    max-attempts: 2
    exception-handler-workflow: partial-error
    description: Publishing to Opencast Media Module
    configurations:
      - download-source-flavors: dublincore/*,security/*
      - download-source-tags: engage-download,atom,rss,mobile
      - streaming-source-tags: engage-streaming
      - check-availability: true
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Save, Archive and Cleanup
  # Archive generated items
  - id: snapshot
    description: Archive work and preview information
    configurations:
      - source-tags: archive
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
