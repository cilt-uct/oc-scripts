id: uct-include-before-edit-auto-trim
title: UCT - Process for Editing (Auto Trim)
tags: []
description: |-
  REQUIRES:
        Flavors:
          */work
          smil/cutting

      Using the work flavors this workflow runs the publish workflow to cut and publish to engage.
operations:
  # Apply the default workflow configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - publishToEngage: true
      - publishToAws: false
      - publishToApi: false
      - publishToOaiPmh: false
      - publishToYouTube: false
      - thumbnailType: 0
      - thumbnailPosition: 1
      - presenter_work_video: false
      - presenter_source_resolution_y: 1080
      - presentation_work_video: false
      - presentation2_work_video: false
      - use_watson: false
      - use_nibity: false
      - use_whisper: false
      - audio_trim_lapel: false
      - transcription_src_flavor: normalized-trimmed
      - doPictureInPicture: false
      - result_publish_process: normalized-trimmed
  # Mark the recording as auto trimmed
  - id: comment
    fail-on-error: false
    description: Mark the recording as being automatically trimmed and published
      (create)
    configurations:
      - description: Auto trimmed
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.AUTOTRIM
      - action: create
  - id: comment
    fail-on-error: false
    description: Mark the recording as being automatically trimmed and published
      (resolve)
    configurations:
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.AUTOTRIM
      - action: resolve
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish

  # Encode and publish the recording to the selected publication
  # channels, unless review for cutting has been selected.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: include
    description: Publish the recording
    configurations:
      - workflow-id: uct-partial-publish
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Transcription / Caption Services
  # Source: ${transcription_src_flavor} - normalized-trimmed
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: include
    description: Include Captioning
    configurations:
      - workflow-id: uct-include-captioning
