id: uct-include-captioning
title: UCT - Include captioning
tags: []
description: |-
  REQUIRES:
          Flavors:
          Source: ${transcription_src_flavor} - trimmed
operations:
  # Apply the default workflow configuration
  - id: defaults
    if: ${isUpload}
    description: Applying default configuration values for captions
    configurations:
      - use_watson: false
      - use_nibity: false
      - use_google: true
      - use_whisper: false
      - audio_trim_lapel: false
      - transcription_src_flavor: delivery
  - id: defaults
    if: NOT(${isUpload})
    description: Applying default configuration values for captions
    configurations:
      - use_watson: false
      - use_nibity: false
      - use_whisper: false
      - use_google: false
      - audio_trim_lapel: false
      - transcription_src_flavor: normalized-trimmed
  # and ${audio_trim_lapel}
  - id: include
    if: ${use_watson}
    description: Do captioning with IBM Watson
    configurations:
      - workflow-id: uct-include-transcription-watson
  # and ${audio_trim_lapel}
  - id: include
    if: ${use_nibity}
    description: Do captioning with Way with Words (nibity)
    configurations:
      - workflow-id: uct-include-transcription-nibity
  # and ${audio_trim_lapel}
  - id: include
    if: ${use_google}
    description: Do captioning with Google Speech-to-Text
    configurations:
      - workflow-id: uct-include-transcription-google
  # and ${audio_trim_lapel}
  - id: include
    if: ${use_whisper}
    description: Do captioning with Whisper API
    configurations:
      - workflow-id: uct-include-transcription-whisper
