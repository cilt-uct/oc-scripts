id: uct-quick-clean
title: UCT - Quick Clean
tags:
  - archive
description: |-
  Clean up previous snapshots and reset to current version

operations:
  # Make sure the workflow contains at least a default configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - removeInput: true
      - removePreview: false
      - removeWork: true
      - removeTrimmed: true
      - removeNormalizedTrimmed: true
      - removeTranscription: true

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeInput}
    exception-handler-workflow: partial-error
    description: Removing archive tags for track_presenter.0/*
    configurations:
      - source-flavors: 'track_presenter.0/*'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeInput}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */input
    configurations:
      - source-flavors: '*/input'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removePreview}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */preview
    configurations:
      - source-flavors: '*/preview'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeWork}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */work
    configurations:
      - source-flavors: '*/work'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeTrimmed}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */trimmed
    configurations:
      - source-flavors: '*/trimmed'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeNormalizedTrimmed}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */normalized-trimmed
    configurations:
      - source-flavors: '*/normalized-trimmed'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeNormalizedTrimmed}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */trimmed-normalized
    configurations:
      - source-flavors: '*/trimmed-normalized'
      - target-tags: -archive

  - id: tag
    max-attempts: 2
    fail-on-error: true
    if: ${removeTranscription}
    exception-handler-workflow: partial-error
    description: Removing archive tags for */transcription
    configurations:
      - source-flavors: '*/transcription'
      - target-tags: -archive

  # snapshot
  - id: snapshot
    description: Archive current state of recording
    configurations:
      - source-tags: archive

  # clean older snapshots
  - id: asset-delete
    fail-on-error: true
    exception-handler-workflow: error
    description: Delete from AssetManager
    configurations:
      - keep-last-snapshot: true

  # Comment that we cleaned up this recording
  - id: comment
    fail-on-error: false
    description: Quick clean-up completed (create)
    configurations:
      - description: Quick clean-up completed.
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.OTHER
      - action: create

  - id: comment
    fail-on-error: false
    description: Quick clean-up completed (resolve)
    configurations:
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.OTHER
      - action: resolve

  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
