id: uct-include-process-for-no-audio
title: UCT - Include process for no audio
tags: []
description: |-
  REQUIRES:
        Flavors:
          */source
        Workflow Properties:
          has_audio
operations:
  # Archive source material and generated items
  - id: snapshot
    if: ${has_audio}
    description: Archive source
    configurations:
      - source-tags: archive

  # Add RESOLVED comment for no audio
  - id: comment
    if: NOT (${has_audio}) 
    description: Mark as no audio
    configurations:
      - description: No audio
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.AUDIO_ISSUE
      - action: create

  - id: comment
    if: NOT (${has_audio}) 
    description: Mark as no audio (resolve)
    configurations:
      - description: No audio.
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.AUDIO_ISSUE
      - action: resolve
