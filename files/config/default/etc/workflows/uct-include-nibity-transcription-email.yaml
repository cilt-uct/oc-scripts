id: uct-include-nibity-transcription-email
title: UCT - Include Nibity Transcription Email
tags: []
description: |-
  Send Nibity Transcription email.
          This is an internal workflow, started by the Nibity Attach Transcript Workflow.
operations:
  - id: send-email
    fail-on-error: true
    if: ${organizer_email_valid} AND ${get_organizer_success} AND ${has-vtt} AND
      ${valid_notification_list}
    exception-handler-workflow: partial-error
    description: Sending nibity transcript and captions email to organizer and
      notification list
    configurations:
      - to: ${organizer_email}
      - cc: ${notification_list}
      - subject: WayWithWords transcript has been published for
          ${catalogs['episode']['title']}
      - body-html-template-file: nibity_publication
      - use-html: true
  - id: send-email
    fail-on-error: true
    if: ${organizer_email_valid} AND ${get_organizer_success} AND
      NOT(${has-vtt}) AND ${valid_notification_list}
    exception-handler-workflow: partial-error
    description: Sending nibity transcript only email to organizer and
      notification list
    configurations:
      - to: ${organizer_email}
      - cc: ${notification_list}
      - subject: WayWithWords transcript has been published for
          ${catalogs['episode']['title']}
      - body-html-template-file: nibity_transcript_only_publication
      - use-html: true
  - id: send-email
    fail-on-error: true
    if: ${organizer_email_valid} AND ${get_organizer_success} AND ${has-vtt} AND
      NOT(${valid_notification_list})
    exception-handler-workflow: partial-error
    description: Sending nibity transcript email to organizer
    configurations:
      - to: ${organizer_email}
      - subject: WayWithWords transcript has been published for
          ${catalogs['episode']['title']}
      - body-html-template-file: nibity_publication
      - use-html: true
  - id: send-email
    fail-on-error: true
    if: ${organizer_email_valid} AND ${get_organizer_success} AND
      NOT(${has-vtt}) AND NOT(${valid_notification_list})
    exception-handler-workflow: partial-error
    description: Sending nibity transcript only email to organizer
    configurations:
      - to: ${organizer_email}
      - subject: WayWithWords transcript has been published for
          ${catalogs['episode']['title']}
      - body-html-template-file: nibity_transcript_only_publication
      - use-html: true
