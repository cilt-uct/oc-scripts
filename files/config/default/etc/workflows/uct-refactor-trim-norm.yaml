id: cleanup-trimmed-normalized
title: Refactoring trimmed-normalized
tags:
  - archive
operations:
  # re-encode
  - id: encode
    description: Encode trimmed-normalized to source
    fail-on-error: true
    exception-handler-workflow: partial-error
    configurations:
      - source-flavors: '*/trimmed-normalized'
      - target-flavor: '*/source'
      - target-tags: archive
      - encoding-profile: uct.trimmed-to-source
  # untag trimmed-normalized
  - id: tag
    description: Exclude trimmed-normalized from archive
    configurations:
      - source-flavors: '*/trimmed-normalized'
      - target-tags: -archive
  # snapshot
  - id: snapshot
    description: Archive current state of recording
    configurations:
      - source-tags: archive
  # clean older snapshots
  - id: asset-delete
    fail-on-error: true
    exception-handler-workflow: error
    description: Delete from AssetManager
    configurations:
      - keep-last-snapshot: true
  # Comment that we cleaned up this recording
  - id: comment
    fail-on-error: false
    description: Comment to say refactoring trimmed-normalized (create)
    configurations:
      - description: Refactoring trimmed-normalized.
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.OTHER
      - action: create
  - id: comment
    fail-on-error: false
    description: Comment to say refactoring trimmed-normalized (resolve)
    configurations:
      - reason: EVENTS.EVENTS.DETAILS.COMMENTS.REASONS.OTHER
      - action: resolve
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
