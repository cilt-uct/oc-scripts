id: uct-start-whisper-transcription
title: Run local Whisper transcription on a video
tags:
  - archive

operations:

  - id: include
    description: Finalize upload and ingest
    configurations:
      - workflow-id: uct-partial-ingest

# note: hypothetically i think uct-process-before-edit-test.yaml would happen first,
