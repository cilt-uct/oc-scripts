# which does an execute-once on /opt/opencast/wfexec/wrapper-whisper-api-transcribe.sh
# which handles the API call to OpenAI for whisper transcription. somewhere along the
# way, something needs to change so whisper is being called locally rather than that API call


### Speech to text workflow

  - id: speechtotext      # from OpenCast docs
    description: Generates subtitles for video and audio files
    configurations:
    - source-flavor: '*/source'
    - target-flavor: captions/source
    - target-tags: engage-download  # ????
    - limit-to-one: true
    #- async: true  ??? default is false
    # - track-selection-strategy: try_presenter_first # defaults to 'everything', which will transcribe every available
    ## audio track - should it prefer presenter or presentation tracks? or is everything ok?
    ## might waste resources if everything.

    # ^ Generates a VTT file that webvtt-to-cutmarks (in uct-whisper-transcription-cutmarks) will use


# Do i need attachment? / async workflow?
## If doing async, i think you could publish then do the attach operation after so it waits for transcription.

# ^ Or that might not make sense since videos will have to be published anyways after the auto-trimming so
# publishing does need to wait for transcription?

# Options: run speechtotext async, publish, speechtotext attach (wait for captions), auto-trim, publish again.
# or: run speechtotext (sync / wait for captions), auto-trim, publish


# next, would go to uct-whisper-transcription-cutmarks (but not rn bc that has a publish operation too)


  - id: include
