id: uct-include-transcription-whisper
title: Submit video for Whisper API Transcription
tags:
  - archive
  - upload
description: |-
  Runs before real publishing of media
operations:
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Inspect mediapackage elements
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: inspect
    description: Inspect mediapackage elements
    configurations:
      - overwrite: false
      - accept-no-media: false
      - accurate-frame-count: false
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Extract audio for transcription
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: encode
    description: Extract audio for transcript generation
    fail-on-error: true
    configurations:
      - source-flavors: presenter/source, presentation/source, track_presentation.0/*
      - target-flavor: audio/source
      - target-tags: transcript
      - encoding-profile: audio-flac-whisper
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Send to Whisper API for transcription - vtt
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: execute-once
    max-attempts: 3
    retry-strategy: hold
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Transcribe using Whisper API
    configurations:
      - exec: /opt/opencast/wfexec/wrapper-whisper-api-transcribe.sh
      - load: '0.1'
      - params: '#{flavor(audio/source)} #{out} #{id}'
      - limit-to-one: true
      - target-flavor: captions/source
      - output-filename: captions.vtt
      - expected-type: Track
      - target-tags: archive,original-captions,lang:en,generator-type:auto,generator:whisper-api,type:closed-caption
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: snapshot
    description: Archive publishing information
    configurations:
      - source-tags: archive
