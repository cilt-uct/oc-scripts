id: uct-partial-publish-test
title: Publish the recording (partial Test)
tags: []
operations:
  - id: analyze-tracks
    exception-handler-workflow: partial-error
    description: Analyze tracks in media package and set control variables
    configurations:
      - source-flavor: '*/work'
  # Tag smil/cutting for later re-use in case of re-publishing of the event
  # Note that WOH editor will re-use target-smil-flavor instead of adding a new one
  - id: tag
    description: Tagging cutting information for archival
    configurations:
      - source-flavors: smil/cutting
      - target-tags: archive
  # Clean out any previous */normalized-trimmed media and captions
  # because we might be re-publishing them.
  - id: tag
    max-attempts: 2
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Removing tags for */normalized-trimmed
    configurations:
      - source-flavors: '*/normalized-trimmed'
      - target-tags: -archive
  - id: tag
    description: Removing previous presenter-cover from download publication
    configurations:
      - source-flavors: presenter/player+preview
      - target-tags: -engage-download
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Clean out previous captions because we might be re-publishing them.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: retract-partial
    max-attempts: 2
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Retract previous trimmed captions from event
    configurations:
      - retract-flavors: captions/vtt
      - retract-tags: engage-download,trimmed
  # Archive smil/cutting right now information to ensure we don't loose it in case later operations fail
  - id: snapshot
    description: Archive cutting information
    configurations:
      - source-tags: archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Cut the video according the SMIL file

  # Perform cutting according to the edit decision list.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: clone
    exception-handler-workflow: partial-error
    description: Create a working copy of the cutting information
    configurations:
      - source-flavor: smil/cutting
      - target-flavor: smil/tmp
  - id: editor
    exception-handler-workflow: partial-error
    description: Cut the recording according to the edit decision list
    configurations:
      - source-flavors: '*/work,captions/source'
      - smil-flavors: smil/tmp
      - target-smil-flavor: smil/tmp
      - target-flavor-subtype: trimmed
      - interactive: false
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # The editor produces a video stream with mimetype 'text/s-matroska' that contains trimmed captions 
  # rather than a VTT

  # Extract trimmed captions from the video container after cutting
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: encode
    exception-handler-workflow: partial-error
    description: Extract trimmed captions
    configurations:
      - source-flavors: captions/trimmed
      - target-flavor: captions/vtt
      - target-tags: engage-download,generator-type:auto,generator:whisper-api,lang:en,trimmed,type:closed-caption
      - encoding-profile: uct-mkv-to-vtt
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 
  # Clean out any previously trimmed captions so they are not re-published
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: tag
    max-attempts: 2
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Removing tags for previously trimmed captions
    configurations:
      - source-flavors: captions/trimmed
      - target-tags: -archive,-engage-download,-lang:en
  ######################################################################
  # TODO:
  # Since OC18+ the normalize-audio workflow operation is no longer
  # supported. SoX-based modules were removed in Opencast 18+
  # (see GitHub PR #6682).
  #
  # This workflow operation (normalize-audio) needs to be updated to use
  # FFmpeg-based audio normalization
  ##########################################################################

  # Normalize Audio (*/trimmed > */normalized-trimmed) -
  # - id: normalize-audio
  #   if: ${doNormalizeAudio}
  #   fail-on-error: true
  #   exception-handler-workflow: partial-error
  #   description: Normalize audio stream
  #   configurations:
  #     - source-flavor: '*/trimmed'
  #     - target-flavor: '*/normalized-trimmed'
  #     - target-tags: norm
  #     - target-decibel: '-30'
  #     - force-transcode: true

  - id: encode
    if: ${doNormalizeAudio}
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Normalize audio stream
    configurations:
      - source-flavor: '*/trimmed'
      - target-flavor: '*/normalized-trimmed'
      - target-tags: norm
      - encoding-profile: uct-audio-normalized

  # Move if not normalizing
  - id: clone
    if: NOT(${doNormalizeAudio})
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Move trimmed to normalized-trimmed (if not normalizing audio)
    configurations:
      - source-flavor: '*/trimmed'
      - target-flavor: '*/normalized-trimmed'
  
  # Tag any optionally uploaded assets
  - id: tag
    if: ${downloadSourceflavorsExist}
    exception-handler-workflow: partial-error
    description: Tagging uploaded assets for distribution
    configurations:
      - source-flavors: '${download-source-flavors}'
      - target-tags: +engage-download
  # normalized-trimmed is the falvor for all workflow steps
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Extract preview images

  # From the edited recording, take preview images for the player,
  # search results etc.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encode to engage search result thumbnails
  - id: image
    if: NOT (${uploadedSearchPreview}) AND ${thumbnailType}==0 AND
      ${presenter_work_video}
    exception-handler-workflow: partial-error
    description: Creating search result default thumbnails
    configurations:
      - source-flavor: presenter/normalized-trimmed
      - target-flavor: presenter/search+preview
      - target-tags: engage-download
      - encoding-profile: search-cover.http
      - time: ${thumbnailPosition}
  - id: image
    if: NOT (${uploadedSearchPreview}) AND ${thumbnailType}==0 AND
      (${presentation_work_video} AND NOT (${presenter_work_video}))
    exception-handler-workflow: partial-error
    description: Creating search result default thumbnails
    configurations:
      - source-flavor: presentation/normalized-trimmed
      - target-flavor: presentation/search+preview
      - target-tags: engage-download
      - encoding-profile: search-cover.http
      - time: ${thumbnailPosition}
  - id: image
    if: NOT (${uploadedSearchPreview}) AND ${thumbnailType}==2
    exception-handler-workflow: partial-error
    description: Creating search result thumbnail from saved position
    configurations:
      - source-flavor: '${thumbnailTrack}/work'
      - target-flavor: '*/search+preview'
      - target-tags: engage-download
      - encoding-profile: search-cover.http
      - time: ${thumbnailPosition}
  - id: image-convert
    if: NOT (${uploadedSearchPreview}) AND ${thumbnailType}==1 AND
      ${presenter_work_video}
    exception-handler-workflow: partial-error
    description: Convert uploaded thumbnail to search result thumbnail
      (presenter track)
    configurations:
      - source-flavors: thumbnail/source
      - target-tags: engage-download
      - target-flavor: 'presenter/search+preview'
      - encoding-profiles: search-cover.http.downscale
  - id: image-convert
    if: NOT (${uploadedSearchPreview}) AND ${thumbnailType}==1 AND
      ${presentation_work_video}
    exception-handler-workflow: partial-error
    description: Convert uploaded thumbnail to search result thumbnail
      (presentation track)
    configurations:
      - source-flavors: thumbnail/source
      - target-tags: engage-download
      - target-flavor: 'presentation/search+preview'
      - encoding-profiles: search-cover.http.downscale
  # Encode to engage player preview images
  - id: image
    exception-handler-workflow: partial-error
    description: Creating player preview image
    configurations:
      - source-flavor: '*/normalized-trimmed'
      - source-tags: ''
      - target-flavor: '*/player+preview'
      - target-tags: engage-download
      - encoding-profile: player-preview.http
      - time: 1
  # NOTE: feed previews generation no longer supported from OC16+
  # Encode to feed cover images
  # - id: image
  #   exception-handler-workflow: partial-error
  #   description: Creating feed cover image
  #   configurations:
  #     - source-flavor: '*/normalized-trimmed'
  #     - source-tags: ''
  #     - target-flavor: '*/feed+preview'
  #     - target-tags: atom,rss
  #     - encoding-profile: feed-cover.http
  #     - time: 1
  # Create a cover image with the default template
  # operation
  #       id="tag"
  #       description="Removing unneeded presenter-cover from download publication">
  #       <configurations>
  #         <configuration key="source-flavors">presenter/player+preview</configuration>
  #         <configuration key="target-tags">-engage-download</configuration>
  #       </configurations>
  #     </operation>

  #     <operation
  #       id="cover-image"
  #       fail-on-error="true"
  #       exception-handler-workflow="partial-error"
  #       description="Create a cover image">
  #       <configurations>
  #         <configuration key="stylesheet">file://${karaf.etc}/branding/coverimage.xsl</configuration>
  #         <configuration key="width">1920</configuration>
  #         <configuration key="height">1080</configuration>
  #         <configuration key="posterimage-flavor">presenter/coverbackground</configuration>
  #         <configuration key="target-flavor">presenter/player+preview</configuration>
  #         <configuration key="target-tags">archive, engage-download</configuration>
  #      </configurations>
  #     </operation
  # Generate timeline preview images
  - id: timelinepreviews
    fail-on-error: false
    if: ${presenter_work_video}
    exception-handler-workflow: error
    description: Creating timeline preview images (Presenter)
    configurations:
      - source-flavor: 'presenter/normalized-trimmed'
      - target-flavor: 'presenter/timeline+preview'
      - target-tags: engage-download
      - image-count: 100
  - id: timelinepreviews
    fail-on-error: false
    if: ${presentation_work_video} AND NOT(${presenter_work_video})
    exception-handler-workflow: error
    description: Creating timeline preview images (Presentation)
    configurations:
      - source-flavor: 'presentation/normalized-trimmed'
      - target-flavor: 'presentation/timeline+preview'
      - target-tags: engage-download
      - image-count: 100
  - id: timelinepreviews
    fail-on-error: false
    if: ${presentation2_work_video} AND NOT(${presentation_work_video}) AND
      NOT(${presenter_work_video})
    exception-handler-workflow: error
    description: Creating timeline preview images (Presentation 2)
    configurations:
      - source-flavor: 'presentation/normalized-trimmed'
      - target-flavor: 'presentation/timeline+preview'
      - target-tags: engage-download
      - image-count: 100
  # Mark captions for publication
  - id: tag
    description: Mark captions for publication
    configurations:
      - source-flavors: captions/shifted
      - target-flavor: captions/delivery
      - target-tags: +engage-download
  # Mark chapters for publication
  - id: tag
    description: Mark chapters for publication
    configurations:
      - source-flavors: chapters/shifted
      - target-flavor: chapters/delivery
      - target-tags: +engage-download
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encode for publication to Engage

  # Encode audio and video formats to the distribution formats that
  # are required by the Engage publication channel.
  # Also encode them for publication to rss and atom feeds.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encoding presenter, presentation and presentation2 for Engage player and feeds

  #       Video: MP4 container, H264 codec. [2160p, 1080p, 720p, 480p, 360p]
  #       Audio: 44100Hz 128k, normalized to -25db
  - if: (${presenter_source_resolution_y} > 2159)
    id: encode
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [2160p, 1080p, 720p, 480p]:
      adaptive-parallel-2160-480.http'
    configurations:
      - source-flavor: '*/normalized-trimmed'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: adaptive-parallel-2160-480.http
  - id: encode
    if: (${presenter_source_resolution_y} < 2160) AND
      (${presenter_source_resolution_y} > 1079)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [1080p, 720p, 480p]: adaptive-parallel-1080-480.http'
    configurations:
      - source-flavor: '*/normalized-trimmed'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: adaptive-parallel-1080-480.http
  - id: encode
    if: (${presenter_source_resolution_y} < 1080) AND
      (${presenter_source_resolution_y} > 719)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [720p, 480p]: adaptive-parallel-720-480.http'
    configurations:
      - source-flavor: '*/normalized-trimmed'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: adaptive-parallel-720-480.http
  - id: encode
    if: (${presenter_source_resolution_y} < 720) AND
      (${presenter_source_resolution_y} > 479)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [480p]: adaptive-480p.http'
    configurations:
      - source-flavor: '*/normalized-trimmed'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: adaptive-parallel.http
  - id: encode
    if: (${presenter_source_resolution_y} < 480)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [other]: adaptive-360p.http'
    configurations:
      - source-flavor: '*/normalized-trimmed'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: adaptive-parallel.http
  # Encoding audio for Engage player and feeds

  #       Audio: MP4 container, 44.1khz 128Kbps

  #       Note: We are not using themes yet
  #             <configuration key="source-flavor">*/normalized-trimmed</configuration>
  - id: encode
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Encoding audio for Engage player (MP3)
    configurations:
      - source-flavor: presenter/normalized-trimmed
      - target-flavor: presenter/delivery
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp3.http
      - process-first-match-only: true
  # Encode audio-only files to mp3
  # - id: encode
  #   if: NOT (${presenter_work_video} OR ${presentation_work_video}) AND (${presenter_work_audio} OR ${presentation_work_audio})
  #   exception-handler-workflow: partial-error
  #   description: Encoding audio-only files to mp3 delivery format
  #   configurations:
  #     - source-flavor: '*/normalized-trimmed'
  #     - target-flavor: '*/delivery'
  #     - target-tags: engage-download,engage-streaming
  #     - encoding-profile: audio-to-m4a.http
  # TODO: skipped this part since */themed flavors are used, and still being developed
  #          See OPENCAST-2289, OPENCAST-2333
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Create Composite download versions of presenter, presentation and
  #       presentation2 in either 2 panel or 3 panel variant.

  #        In: */${result_publish_process} default: normalized-trimmed
  #       Out: composite/delivery
  - id: include
    description: Include publishing for downloads
    configurations:
      - workflow-id: uct-partial-publish-downloads
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Create a picture-in-picture variant of

  #        In: */${result_publish_process} default: trimmed
  #       Out: pic-in-pic/delivery
  - id: include
    if: ${doPictureInPicture}
    description: Include encode picture-in-picture
    configurations:
      - workflow-id: uct-include-picture-in-picture
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Segment video streams and extract metadata

  # Apply the video segmentation algorithm to the presentation tracks
  # and extract segment preview images and metadata.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: segment-video
    fail-on-error: false
    if: ${presentation_work_video}
    description: Detecting slide transitions in presentation track
    configurations:
      - source-flavor: presentation/normalized-trimmed
      - target-tags: engage-download
  # If there is a presentation2 video but not a presentation video
  - id: segment-video
    fail-on-error: false
    if: NOT(${presentation_work_video}) AND ${presentation2_work_video}
    description: Detecting slide transitions in presentation2 track
    configurations:
      - source-flavor: presentation2/normalized-trimmed
      - target-tags: engage-download
  # Generate segment preview images
  - id: segmentpreviews
    fail-on-error: false
    if: ${presentation_work_video}
    description: Creating preview images for presentation segments
    configurations:
      - source-flavor: presentation/normalized-trimmed
      - target-flavor: 'presentation/segment+preview'
      - reference-flavor: presentation/delivery
      - reference-tags: engage-download
      - target-tags: engage-download
      - encoding-profile: player-slides.http
  # If there is a presentation2 video but not a presentation video
  - id: segmentpreviews
    fail-on-error: false
    if: NOT(${presentation_work_video}) AND ${presentation2_work_video}
    description: Creating preview images for presentation2 segments
    configurations:
      - source-flavor: presentation2/normalized-trimmed
      - target-flavor: 'presentation/segment+preview'
      - reference-flavor: presentation2/delivery
      - reference-tags: engage-download
      - target-tags: engage-download
      - encoding-profile: player-slides.http
  # Extract text form slide preview images
  - id: extract-text
    fail-on-error: false
    if: ${presentation_work_video}
    description: Extracting text from presentation segments
    configurations:
      - source-flavor: presentation/normalized-trimmed
      - target-tags: engage-download,archive
  - id: extract-text
    fail-on-error: false
    if: ${presentation2_work_video} AND NOT(${presentation_work_video})
    description: Extracting text from presentation2 segments
    configurations:
      - source-flavor: presentation2/normalized-trimmed
      - target-tags: engage-download,archive

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to publication channels

  # Send the encoded material along with the metadata to the
  # publication channels.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to engage player
  - id: publish-engage
    if: ${publishToEngage}
    max-attempts: 2
    exception-handler-workflow: partial-error
    description: Publishing to Opencast Media Module
    configurations:
      - download-source-flavors: dublincore/*,security/*,captions/vtt
      - download-source-tags: engage-download,atom,rss,mobile,trimmed
      - streaming-source-tags: engage-streaming,trimmed
      - check-availability: true