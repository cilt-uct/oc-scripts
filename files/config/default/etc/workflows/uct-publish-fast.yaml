id: fast
title: UCT - Publish Opencast Studio upload
tags: []
operations:
  # Apply the default workflow configuration
  - id: defaults
    description: Applying default configuration values
    configurations:
      - hasSlides: false
      - thumbnailType: 0
      - thumbnailPosition: 1
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Inspect, analyze tracks (*/*), apply series access control
  #       archive */source, and tag metadata for archive and publish.
  # Inspect the media
  - id: inspect
    exception-handler-workflow: partial-error
    description: Inspecting source media
    configurations:
      - overwrite: true
      - accept-no-media: false
      - accurate-frame-count: true
  # Load workflow properties from metadata: update some workflow properties
  # <operation
  #       id="execute-once"
  #       max-attempts="3"
  #       retry-strategy="hold"
  #       fail-on-error="true"
  #       exception-handler-workflow="partial-error"
  #       description="Load workflow properties from settings in series">
  #       <configurations>
  #         <configuration key="exec">/opt/opencast/wfexec/load-from-metadata.pl</configuration>
  #         <configuration key="load">0.1</configuration>
  #         <configuration key="params">#{id} #{out}</configuration>
  #         <configuration key="output-filename">metadata_workflow.txt</configuration>
  #         <configuration key="set-workflow-properties">true</configuration>
  #         <configuration key="expected-type">Attachment</configuration>
  #       </configurations>
  #     </operation>
  # Apply access control lists from series to the mediapackage.
  #       Only runs if Event is linked to Series, SKIPPED if not.
  - id: series
    exception-handler-workflow: partial-error
    description: Applying access control entries
    configurations:
      - attach: '*'
      - apply-acl: true
  # make sure to save ACL and dublincore
  - id: tag
    exception-handler-workflow: partial-error
    description: Add archive tags for dublincore/*,security/*
    configurations:
      - source-flavors: dublincore/*,security/*
      - target-tags: archive
  # Tag the incoming metadata catalogs for publishing
  - id: tag
    description: Tagging metadata catalogs for publication
    configurations:
      - source-flavors: dublincore/*
      - target-tags: +engage-download
  # Analyze Tracks: set flavor_source workflow properties
  - id: analyze-tracks
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: 'Analyze: SOURCE'
    configurations:
      - source-flavor: '*/source'
      - aspect-ratio: 4/3,16/9
  # check if source video has audio and add to work versions
  - id: execute-many
    fail-on-error: true
    retry-strategy: hold
    exception-handler-workflow: partial-error
    description: Check if presenter has audio
    configurations:
      - exec: /opt/opencast/wfexec/check-for-audio.sh
      - params: '-i #{in} -o #{out}'
      - source-flavor: presenter/source
      - source-video: true
      - output-filename: enhanced.mp4
      - target-flavor: presenter/work
      - expected-type: Track
      - load: '2.0'
  - id: execute-many
    fail-on-error: true
    retry-strategy: hold
    exception-handler-workflow: partial-error
    description: Check if presentation has audio
    configurations:
      - exec: /opt/opencast/wfexec/check-for-audio.sh
      - params: '-i #{in} -o #{out}'
      - source-flavor: presentation/source
      - source-video: true
      - output-filename: enhanced.mp4
      - target-flavor: presentation/work
      - expected-type: Track
      - load: '2.0'
  # Tag the sources for archival
  - id: tag
    description: Tagging source material for archival
    configurations:
      - source-flavors: '*/*'
      - target-tags: +archive
  # Untag work flavors
  - id: tag
    description: Untag all work flavors
    configurations:
      - source-flavors: '*/work'
      - target-tags: -archive
  # Analyze Tracks
  - id: analyze-tracks
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: 'Analyze: WORK'
    configurations:
      - source-flavor: '*/work'
  # Save workflow properties
  - id: export-wf-properties
    fail-on-error: false
    exception-handler-workflow: partial-error
    description: Export workflow settings to Java properties file
    configurations:
      - target-flavor: processing/defaults
      - target-tags: archive
  # Archive generated items
  - id: snapshot
    description: Archive source
    configurations:
      - source-tags: archive
  # DO normalization here
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Process video in parallel for publishing - without normalizing audio
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encode for publication to Engage

  # Encode audio and video formats to the distribution formats that
  # are required by the Engage publication channel.
  # Also encode them for publication to rss and atom feeds.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Encoding presenter for Engage player and feeds

  #       Video: MP4 container, H264 codec. [1080p 720p, 480p or other
  #       Audio: 44100Hz 128k, NOT NORMALIZED
  # A
  - id: encode
    if: (${presenter_work_resolution_y} > 1079) OR
      (${presentation_work_resolution_y} > 1079)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [1080p, 720p, 480p]: mp4-480-720-1080-parallel'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-480-720-1080-parallel.http
  # B
  - id: encode
    if: ((${presenter_work_resolution_y} < 1080) AND
      (${presenter_work_resolution_y} > 719)) OR
      ((${presentation_work_resolution_y} < 1080) AND
      (${presentation_work_resolution_y} > 719))
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [720p, 480p]: mp4-480-720-parallel'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-480-720-parallel.http
  # C
  - id: encode
    if: ((${presenter_work_resolution_y} < 720) AND
      (${presenter_work_resolution_y} > 479)) OR
      ((${presentation_work_resolution_y} < 720) AND
      (${presentation_work_resolution_y} > 479))
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [480p]: mp4-480'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-480.http
  # D
  - id: encode
    if: (${presenter_work_resolution_y} < 480) OR
      (${presenter_work_resolution_y} < 480)
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: 'Encoding for player and feeds (MP4) [other]: mp4-other'
    configurations:
      - source-flavor: '*/work'
      - target-flavor: '*/delivery'
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp4-other.http
  # Encoding audio for Engage player and feeds

  #       Audio: MP4 container, 44.1khz 128Kbps

  #       Note: We are not using themes yet
  #             <configuration key="source-flavor">presenter/themed</configuration>
  - id: encode
    fail-on-error: false
    exception-handler-workflow: partial-error
    if: ${presenter_work_media} AND NOT(${presentation_work_media})
    description: Encoding audio for Engage player (MP3)
    configurations:
      - source-flavor: '*/work'
      - target-flavor: presenter/delivery
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp3.http
      - process-first-match-only: true
  - id: encode
    fail-on-error: false
    exception-handler-workflow: partial-error
    if: ${presentation_work_media} AND NOT(${presenter_work_media})
    description: Encoding audio for Engage player (MP3)
    configurations:
      - source-flavor: '*/work'
      - target-flavor: presentation/delivery
      - target-tags: engage-download,engage-streaming,rss,atom
      - encoding-profile: mp3.http
      - process-first-match-only: true
  # Image - Search
  - id: image
    exception-handler-workflow: partial-error
    description: Creating search result thumbnails
    configurations:
      - source-flavor: '*/delivery'
      - source-tags: ''
      - target-flavor: '*/search+preview'
      - target-tags: engage-download
      - encoding-profile: search-cover.http
      - time: 5
  # Image - Player preview
  - id: image
    exception-handler-workflow: partial-error
    description: Creating player preview image
    configurations:
      - source-flavor: '*/delivery'
      - source-tags: ''
      - target-flavor: '*/player+preview'
      - target-tags: engage-download
      - encoding-profile: player-preview.http
      - time: 5
  # NOTE: feed previews generation no longer supported from OC16+
  # Encode to feed cover images
  # - id: image
  #   exception-handler-workflow: partial-error
  #   description: Creating feed cover image
  #   configurations:
  #     - source-flavor: '*/delivery'
  #     - source-tags: ''
  #     - target-flavor: '*/feed+preview'
  #     - target-tags: atom,rss
  #     - encoding-profile: feed-cover.http
  #     - time: 5
  - id: tag
    description: Removing unneeded cover from download publication
    configurations:
      - source-flavors: '*/player+preview'
      - target-tags: -engage-download
  - id: image
    exception-handler-workflow: partial-error
    description: Creating player preview image
    configurations:
      - source-flavor: '*/delivery'
      - source-tags: ''
      - target-flavor: '*/coverbackground'
      - encoding-profile: player-preview.http
      - time: 1
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Create Composite download versions of presenter, presentation and
  #       presentation2 in either 2 panel or 3 panel variant.

  #        In: */${result_publish_process} default: normalized-trimmed
  #       Out: composite/delivery
  - id: include
    description: Include publishing for downloads
    configurations:
      - workflow-id: uct-partial-publish-downloads
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Publish to publication channels

  # Send the encoded material along with the metadata to the
  # publication channels.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: publish-engage
    max-attempts: 2
    exception-handler-workflow: partial-error
    description: Publishing to Opencast Media Module
    configurations:
      - download-source-flavors: dublincore/*,security/*
      - download-source-tags: engage-download,atom,rss,mobile
      - streaming-source-tags: engage-streaming
      - check-availability: true
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  - id: snapshot
    description: Archive publishing information
    configurations:
      - source-tags: archive
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #       Do the work to prepare for editing. (*/preview)
  - id: include
    if: ${presenter_work_media} OR ${presentation_work_media}
    description: Prepare preview versions for Editing
    configurations:
      - workflow-id: uct-partial-preview
  # Save workflow properties
  - id: export-wf-properties
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Export workflow settings to Java properties file
    configurations:
      - target-flavor: processing/defaults
      - target-tags: archive
  # Archive generated items
  - id: snapshot
    description: Archive work and preview information
    configurations:
      - source-tags: archive
  - id: include
    description: Send e-mail to course organiser that event has been published
    configurations:
      - workflow-id: uct-opencast-studio-notification
  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Cleaning up - remove temp processing artifacts
    configurations:
      - delete-external: false
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      - preserve-flavors: dublincore/*,security/*
      - delay: 5
